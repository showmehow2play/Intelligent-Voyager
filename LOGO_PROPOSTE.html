<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proposte logo — Intelligent Voyager</title>
  <style>
    :root { color: #4b3524; background: #eee2c8; font-family: Georgia, serif; }
    body { margin: 0; padding: 24px; }
    main { width: min(900px, 100%); margin: auto; }
    h1 { margin-bottom: 6px; }
    p { color: #765136; }
    .grid { display: grid; gap: 18px; }
    figure { margin: 0; padding: 18px; border: 1px solid #c9ac7a; border-radius: 18px; background: #f8efd9; box-shadow: 0 10px 25px rgba(75,53,36,.08); }
    img { display: block; width: 100%; height: auto; }
    figcaption { margin-top: 12px; color: #765136; font-size: 14px; line-height: 1.45; }
    strong { color: #4b3524; }
  </style>
</head>
<body>
  <main>
    <h1>Proposte logo</h1>
    <p>Tre direzioni visive per Intelligent Voyager. Il logo attuale non viene sostituito finché non scegli.</p>
    <div class="grid">
      <figure><img src="logo-proposta-cartografia.svg" alt="Proposta cartografia"><figcaption><strong>1. Cartografia</strong> — rosa dei venti, rotta tratteggiata e colori da vecchia carta geografica.</figcaption></figure>
      <figure><img src="logo-proposta-passaporto.svg" alt="Proposta passaporto"><figcaption><strong>2. Passaporto</strong> — più caldo e distintivo, con timbro di viaggio e atmosfera da diario.</figcaption></figure>
      <figure><img src="logo-proposta-esploratore.svg" alt="Proposta esploratore"><figcaption><strong>3. Esploratore</strong> — mappa piegata, montagne, rotta e stella; il più narrativo e avventuroso.</figcaption></figure>
    </div>
  </main>
</body>
</html>
