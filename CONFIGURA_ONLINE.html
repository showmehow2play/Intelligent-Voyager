<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configura collegamento online</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #15243a; background: #f5f8fc; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
    main { width: min(650px, 100%); padding: 30px; border: 1px solid #dce5ef; border-radius: 22px; background: white; box-shadow: 0 18px 50px rgba(19,34,56,.10); }
    h1 { margin: 0 0 10px; letter-spacing: -.04em; }
    p, li { color: #65768c; line-height: 1.55; }
    .notice { padding: 14px; border-radius: 12px; background: #fff3cd; color: #765614; font-size: 13px; line-height: 1.5; }
    label { display: block; margin: 16px 0 6px; font-size: 12px; font-weight: 800; }
    input { width: 100%; box-sizing: border-box; padding: 11px; border: 1px solid #dce5ef; border-radius: 9px; font: inherit; }
    button, a { display: inline-block; margin: 18px 8px 0 0; padding: 12px 16px; border: 0; border-radius: 10px; background: #5267f3; color: white; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    a { background: #eef0ff; color: #4052d2; }
    #status { margin-top: 16px; color: #087d68; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>Configura il nuovo database online</h1>
    <p>Inserisci i dati del nuovo progetto Supabase per generare il file di configurazione della nuova app.</p>
    <div class="notice"><strong>Importante:</strong> usa soltanto il <em>Project URL</em> e la chiave <em>anon/public</em>. Non inserire mai la chiave <em>service_role</em>.</div>
    <label for="url">Project URL</label>
    <input id="url" type="url" placeholder="https://xxxxxxxx.supabase.co" autocomplete="off">
    <label for="anonKey">Anon/public key</label>
    <input id="anonKey" type="text" placeholder="eyJ..." autocomplete="off">
    <button id="download">Scarica config.js</button>
    <a href="PUBBLICAZIONE_ONLINE.md">Leggi la guida</a>
    <a href="AVVIA_APP.html">Torna all'avvio</a>
    <div id="status"></div>
  </main>
  <script>
    document.getElementById('download').addEventListener('click', () => {
      const url = document.getElementById('url').value.trim();
      const anonKey = document.getElementById('anonKey').value.trim();
      const status = document.getElementById('status');
      if (!/^https:\/\/.+/.test(url) || !anonKey) { status.textContent = 'Inserisci un Project URL HTTPS e la chiave anon/public.'; status.style.color = '#d95c65'; return; }
      const content = `// Configurazione pubblica della nuova app.\\nwindow.TRAVEL_NEXT_SUPABASE_CONFIG = ${JSON.stringify({ url, anonKey }, null, 2)};\\n`;
      const blob = new Blob([content], { type: 'application/javascript' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'config.js';
      link.click();
      URL.revokeObjectURL(link.href);
      status.textContent = 'config.js scaricato. Sostituiscilo nella cartella supabase prima di pubblicare la nuova app.';
      status.style.color = '#087d68';
    });
  </script>
</body>
</html>
